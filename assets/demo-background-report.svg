<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
  <title id="title">Background Run Report demo surface</title>
  <desc id="desc">Mock screenshot of the Obsidian Brain Background Run Report with job statuses, duration, lock path, and next actions.</desc>
  <rect width="1180" height="700" fill="#f6f8fb"/>
  <rect x="44" y="34" width="1092" height="632" rx="12" fill="#ffffff" stroke="#d6dce7"/>
  <rect x="44" y="34" width="1092" height="56" rx="12" fill="#1f2937"/>
  <circle cx="78" cy="62" r="7" fill="#ff5f57"/>
  <circle cx="102" cy="62" r="7" fill="#ffbd2e"/>
  <circle cx="126" cy="62" r="7" fill="#28c840"/>
  <text x="164" y="68" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Maintenance/Background Run Report.md</text>
  <text x="84" y="138" fill="#101828" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Background Run Report</text>
  <rect x="84" y="166" width="190" height="72" rx="8" fill="#ecfdf3" stroke="#abefc6"/>
  <text x="110" y="196" fill="#067647" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">STATUS</text>
  <text x="110" y="222" fill="#067647" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">ok</text>
  <rect x="298" y="166" width="250" height="72" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="324" y="196" fill="#475467" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">LOCK</text>
  <text x="324" y="222" fill="#344054" font-family="Inter, Arial, sans-serif" font-size="17">.brain-background.lock</text>
  <rect x="572" y="166" width="250" height="72" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="598" y="196" fill="#475467" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">JSON</text>
  <text x="598" y="222" fill="#344054" font-family="Inter, Arial, sans-serif" font-size="17">.brain-background-last-run.json</text>
  <rect x="846" y="166" width="210" height="72" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="872" y="196" fill="#475467" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">DURATION</text>
  <text x="872" y="222" fill="#344054" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">1248 ms</text>
  <text x="84" y="294" fill="#101828" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Jobs</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16">
    <rect x="84" y="318" width="992" height="50" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="108" y="349" fill="#067647">ok</text>
    <text x="180" y="349" fill="#344054">build_brain_dashboard</text>
    <text x="482" y="349" fill="#667085">path=Knowledge/_brain.md</text>
    <rect x="84" y="368" width="992" height="50" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="108" y="399" fill="#067647">ok</text>
    <text x="180" y="399" fill="#344054">build_knowledge_inbox</text>
    <text x="482" y="399" fill="#667085">open actions=6</text>
    <rect x="84" y="418" width="992" height="50" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="108" y="449" fill="#067647">ok</text>
    <text x="180" y="449" fill="#344054">safe_maintenance_preview</text>
    <text x="482" y="449" fill="#667085">Dry-Run bleibt erzwungen</text>
    <rect x="84" y="468" width="992" height="50" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="108" y="499" fill="#067647">ok</text>
    <text x="180" y="499" fill="#344054">hook_repair_preview</text>
    <text x="482" y="499" fill="#667085">Dry-Run bleibt erzwungen</text>
  </g>
  <text x="84" y="578" fill="#475467" font-family="Inter, Arial, sans-serif" font-size="16">The report is normal Markdown and can be inspected later in Obsidian.</text>
</svg>
