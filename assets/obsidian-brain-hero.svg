  <text x="94" y="234" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="70" font-weight="900">OBSIDIAN</text>
  <text x="94" y="306" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="74" font-weight="900">BRAIN MCP</text>
  <text x="100" y="350" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="600">Claude Code hooks + local Markdown vault + adaptive auto-build</text>

  <g transform="translate(94 384)">
    <rect x="0" y="0" width="154" height="38" rx="19" fill="#312e81" stroke="#818cf8"/>
    <text x="24" y="25" fill="#e0e7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">MCP Server</text>
    <rect x="170" y="0" width="168" height="38" rx="19" fill="#064e3b" stroke="#34d399"/>
    <text x="195" y="25" fill="#d1fae5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Auto-Build</text>
    <rect x="356" y="0" width="155" height="38" rx="19" fill="#7c2d12" stroke="#fb923c"/>
    <text x="382" y="25" fill="#ffedd5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">Dry-Run Safe</text>
  </g>

  <g transform="translate(805 316)">
    <rect x="0" y="0" width="250" height="104" rx="20" fill="#020617" stroke="#334155"/>
    <text x="24" y="34" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">brain_health_check</text>
    <text x="24" y="62" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">Status: ok</text>
    <text x="24" y="88" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">captures -> memory -> vault</text>
  </g>

  <g transform="translate(902 120)">
    <rect x="0" y="0" width="122" height="122" rx="24" fill="url(#orange)" opacity="0.96"/>
    <path d="M61 24V98M24 61H98M36 36L86 86M86 36L36 86" stroke="#fff7ed" stroke-width="9" stroke-linecap="round"/>
    <circle cx="61" cy="61" r="12" fill="#fff7ed"/>
  </g>
</svg>
