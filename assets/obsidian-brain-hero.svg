<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Obsidian Brain MCP hero banner</title>
  <desc id="desc">A dark Claude Code and Obsidian themed banner showing a connected knowledge graph, terminal workflow, and vault memory layers.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#3b1d72" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#111827" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="card" x1="155" y1="88" x2="1038" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="accent" x1="208" y1="148" x2="803" y2="332" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.48" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#334155" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="34" fill="url(#bgGlow)"/>
  <rect width="1200" height="520" rx="34" fill="url(#grid)"/>
  <circle cx="1005" cy="88" r="220" fill="#7c3aed" fill-opacity="0.16"/>
  <circle cx="178" cy="411" r="260" fill="#06b6d4" fill-opacity="0.10"/>

  <g filter="url(#softShadow)">
    <rect x="58" y="54" width="1084" height="412" rx="28" fill="url(#card)" stroke="#475569" stroke-opacity="0.5"/>
  </g>

  <g opacity="0.78" stroke="#94a3b8" stroke-width="1.4">
    <path d="M149 162L228 116L294 167L244 249L158 236Z"/>
    <path d="M228 116L244 249L340 249L294 167"/>
    <path d="M158 236L244 249L222 345L132 318Z"/>
    <path d="M244 249L340 249L381 336L222 345"/>
    <path d="M340 249L440 192L510 251L381 336"/>
    <path d="M440 192L585 162L646 235L510 251"/>
    <path d="M646 235L742 180L835 253L760 341Z"/>
    <path d="M510 251L646 235L760 341L592 363Z"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="149" cy="162" r="7" fill="#a78bfa"/>
    <circle cx="228" cy="116" r="5" fill="#22d3ee"/>
    <circle cx="294" cy="167" r="6" fill="#f472b6"/>
    <circle cx="244" cy="249" r="8" fill="#34d399"/>
    <circle cx="158" cy="236" r="5" fill="#fde047"/>
    <circle cx="222" cy="345" r="7" fill="#fb923c"/>
    <circle cx="340" cy="249" r="6" fill="#60a5fa"/>
    <circle cx="381" cy="336" r="6" fill="#a78bfa"/>
    <circle cx="440" cy="192" r="7" fill="#22d3ee"/>
    <circle cx="510" cy="251" r="8" fill="#34d399"/>
