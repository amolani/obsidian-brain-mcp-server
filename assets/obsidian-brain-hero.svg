    <circle cx="646" cy="235" r="7" fill="#fde047"/>
    <circle cx="742" cy="180" r="6" fill="#fb923c"/>
    <circle cx="835" cy="253" r="8" fill="#a78bfa"/>
    <circle cx="760" cy="341" r="6" fill="#22d3ee"/>
    <circle cx="592" cy="363" r="7" fill="#34d399"/>
  </g>

  <g transform="translate(94 92)">
    <rect x="0" y="0" width="236" height="82" rx="18" fill="#020617" stroke="#475569"/>
    <circle cx="29" cy="29" r="7" fill="#ef4444"/>
    <circle cx="52" cy="29" r="7" fill="#f59e0b"/>
    <circle cx="75" cy="29" r="7" fill="#22c55e"/>
    <text x="27" y="61" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">$ claude code</text>
  </g>

  <g transform="translate(678 102)" filter="url(#softShadow)">
    <path d="M70 0L132 30L111 116L54 146L0 94L20 28Z" fill="#111827" stroke="#8b5cf6" stroke-width="3"/>
    <path d="M70 12L103 35L82 72L43 86L27 48Z" fill="#a78bfa"/>
